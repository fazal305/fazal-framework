<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Router Demo — fazal-framework</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" />
    <meta name="description" content="Live demo of the Router module in fazal-framework, a tiny, real, dependency-free frontend framework." />
    <link rel="canonical" href="https://fazal305.github.io/fazal-framework/router-demo.html" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fazal305.github.io/fazal-framework/router-demo.html" />
    <meta property="og:title" content="Router Demo — fazal-framework" />
    <meta property="og:description" content="Live demo of the Router module in fazal-framework, a tiny, real, dependency-free frontend framework." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Router Demo — fazal-framework" />
    <meta name="twitter:description" content="Live demo of the Router module in fazal-framework, a tiny, real, dependency-free frontend framework." />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="css/router-demo.css" />
</head>

<body>
    <div class="app-shell" data-shell>
        <main class="main-content">
            <header class="page-header">
                <span class="eyebrow">Router Subsystem</span>
                <h1 class="page-title">Hash Router Demo</h1>
                <p class="page-subtitle">
                    This page contains a mini single-page app powered by
                    <strong>FazalFramework.Router</strong>. It works through hash routing,
                    supports params, and does not reload the full page.
                </p>
            </header>

            <section class="grid grid-2">
                <div class="card-panel router-shell">
                    <h2>Mini Router Area</h2>

                    <nav class="router-mini-nav" id="routerMiniNav">
                        <button class="btn-theme" data-route="/">Home</button>
                        <button class="btn-ghost" data-route="/products">Products</button>
                        <button class="btn-ghost" data-route="/product/101">Product 101</button>
                        <button class="btn-ghost" data-route="/profile/fazal">Profile Param</button>
                    </nav>

                    <div class="router-view card-panel" id="routerView"></div>
                </div>

                <div class="card-panel">
                    <h2>Current Route Readout</h2>
                    <p class="muted">
                        This panel updates from <code>onRouteChange()</code>.
                    </p>

                    <div class="route-readout">
                        <div>
                            <strong>Path</strong>
                            <div class="route-param" id="currentPath">-</div>
                        </div>

                        <div>
                            <strong>Params</strong>
                            <pre id="currentParams">{}</pre>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="framework/fazal-event-bus.js"></script>
    <script src="framework/fazal-state.js"></script>
    <script src="framework/fazal-theme-engine.js"></script>
    <script src="framework/fazal-router.js"></script>
    <script src="framework/fazal-component.js"></script>
    <script src="framework/fazal-plugin-system.js"></script>
    <script src="framework/fazal-framework.js"></script>

    <script src="js/shared.js"></script>
    <script src="js/router-demo.js"></script>
</body>

</html>
