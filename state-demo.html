<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fazal Framework | State Demo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="css/state-demo.css" />
</head>

<body>
    <div class="app-shell" data-shell>
        <main class="main-content">
            <header class="page-header">
                <span class="eyebrow">State Subsystem</span>
                <h1 class="page-title">State Management Demo</h1>
                <p class="page-subtitle">
                    Two independent panels subscribe to one shared observable store.
                    Change one side and the other updates instantly.
                </p>
            </header>

            <section class="grid grid-2 mb-4">
                <div class="card-panel state-panel" id="inventoryPanel"></div>
                <div class="card-panel state-panel" id="salesPanel"></div>
            </section>

            <section class="grid grid-2">
                <div class="card-panel">
                    <h2>Current State JSON</h2>
                    <p class="muted">Updated live from the same store subscription.</p>
                    <pre class="state-json" id="stateJson">{}</pre>
                </div>

                <div class="card-panel">
                    <h2>Subscription Log</h2>
                    <p class="muted">Every real store update appears here.</p>
                    <div class="event-log" id="stateLog"></div>
                </div>
            </section>
        </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="framework/fazal-event-bus.js"></script>
    <script src="framework/fazal-state.js"></script>
    <script src="framework/fazal-theme-engine.js"></script>
    <script src="framework/fazal-router.js"></script>
    <script src="framework/fazal-component.js"></script>
    <script src="framework/fazal-plugin-system.js"></script>
    <script src="framework/fazal-framework.js"></script>

    <script src="js/shared.js"></script>
    <script src="js/state-demo.js"></script>
</body>

</html>
